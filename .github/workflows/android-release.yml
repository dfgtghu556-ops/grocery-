name: Publish BudgetBasket Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_RELEASE_SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build web app and sync Android
        run: npm run android:sync
      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Stage installable preview APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/BudgetBasket-debug-preview.apk
      - name: Decode Android release signing key
        if: ${{ env.ANDROID_RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/budgetbasket-release.jks"
      - name: Build production-signed release APK
        if: ${{ env.ANDROID_RELEASE_SIGNING_ENABLED == 'true' }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/budgetbasket-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Stage production-signed APK
        if: ${{ env.ANDROID_RELEASE_SIGNING_ENABLED == 'true' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk release-assets/BudgetBasket-release.apk
      - name: Write APK checksums
        run: sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BudgetBasket ${{ inputs.tag_name || github.ref_name }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          prerelease: ${{ env.ANDROID_RELEASE_SIGNING_ENABLED != 'true' }}
          files: release-assets/*
          body: |
            Install `BudgetBasket-debug-preview.apk` on an Android device for a sideload preview.

            A production-signed `BudgetBasket-release.apk` is included only when the repository's Android signing secrets are configured. Debug-signed APKs are for testing and are not Play Store releases.
