name: Build BudgetBasket Android APK

on:
  push:
    branches:
      - arena/01a0ffcb-grocery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Copy web app into the Android project
        run: npx cap sync android
      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: budgetbasket-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
